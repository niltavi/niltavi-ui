  <title id="art-title">niltavi</title>
  <desc id="art-desc">A paper-cut interpretation of the reference bird: a blue-violet crown, dark indigo wings, saffron breast and a slender brown tail, resting on a diagonal twig.</desc>
  <!-- A small, warm perch grounds the silhouette. It is a separate scene layer. -->
  <g id="art-perch">
