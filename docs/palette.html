<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Niltava 仙鹟色卡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版式：色条 → 色阶 → HeroUI token → 图表色 → 导出；顶栏放色觉模拟 */
:root{
  --bg:#F5F1E6; --surface:#F6F3EA; --surface-2:#E5E3D9; --line:#D6D6CB; --ink:#283E38; --ink-2:#57675F; --ink-3:#57675F; --blue:#3A5CF4; --rufous:#BF4100; --focus:#5882FF;
  --f-display:"Iowan Old Style", "Songti SC", "Noto Serif CJK SC", serif;
  --f-body:"PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --f-mono:ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1224; --surface:#1B2235; --surface-2:#262D40; --line:#2B3245; --ink:#F5F1E6; --ink-2:#A1A6B3; --ink-3:#A1A6B3; --blue:#79A4FF; --rufous:#F68400; --focus:#79A4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1224; --surface:#1B2235; --surface-2:#262D40; --line:#2B3245; --ink:#F5F1E6; --ink-2:#A1A6B3; --ink-3:#A1A6B3; --blue:#79A4FF; --rufous:#F68400; --focus:#79A4FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-block:40px 96px;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:400;line-height:1.2}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.hero{display:flex;flex-direction:column;gap:20px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero h1 .r{color:var(--rufous)}
.specimen{display:flex;height:88px;border-radius:8px;overflow:hidden}
.specimen div{min-width:0}

.seg{display:inline-flex;gap:2px;padding:3px;border-radius:6px;background:var(--surface-2)}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:4px 12px;border-radius:4px;font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

.scales{display:flex;flex-direction:column;gap:20px}
.scale{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:start}
.scale-meta{padding-top:4px}
.scale-meta span{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3)}
.steps{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.step{border:0;padding:0;background:none;display:flex;flex-direction:column;gap:5px;text-align:left;color:var(--ink)}
.step .sw{height:52px;border-radius:6px;display:flex;align-items:flex-end;padding:5px;font-family:var(--f-mono);font-size:.6rem;transition:transform .15s}
.step.key .sw{box-shadow:inset 0 0 0 2px var(--bg),0 0 0 2px var(--ink)}
.step .lbl{font-family:var(--f-mono);font-size:.64rem;color:var(--ink-2)}
.step:hover .sw{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.step .sw{transition:none}}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.86rem}
th,td{padding:8px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
tr:last-child td{border-bottom:0}
td code{font-family:var(--f-mono);font-size:.8rem}
.cell{display:flex;align-items:center;gap:10px}
.cell small{display:block;font-family:var(--f-mono);color:var(--ink-3);font-size:.7rem;line-height:1.3}
.dot{width:22px;height:22px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.group td{background:var(--surface-2);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-block:6px}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-card{border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);min-width:0}
.chart-card .t{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.series{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.series div{height:44px;border-radius:6px;display:flex;align-items:flex-end;padding:4px 5px;font-family:var(--f-mono);font-size:.6rem}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}
.bars i{flex:1;border-radius:3px 3px 0 0}
.ramp{display:flex;height:22px;border-radius:6px;overflow:hidden}
.ramp i{flex:1}
.ramps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ramps div{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--ink-2)}

.code{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.code-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.copy{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:.8rem}
pre{margin:0;padding:14px;overflow:auto;max-height:480px;font-family:var(--f-mono);font-size:.74rem;line-height:1.55;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-family:var(--f-mono);font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:820px){
  .scale{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(6,minmax(0,1fr));row-gap:10px}
  .charts,.ramps{grid-template-columns:1fr}
  .series{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>

<svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs id="cvd-defs"></defs></svg>
<div class="wrap">
  <header class="hero">
    <div class="head">
      <span class="eyebrow">Niltava · HeroUI v3 Theme</span>
      <div class="seg" id="vision" role="group" aria-label="色觉模拟"></div>
    </div>
    <h1>仙鹟色卡 · <em>钴蓝</em>与<span class="r">棕腹</span></h1>
    <div class="specimen" id="specimen" aria-hidden="true"></div>
  </header>

  <main id="sim" style="display:flex;flex-direction:column;gap:56px">
    <section>
      <h2>色阶</h2>
      <div class="scales" id="scales"></div>
    </section>

    <section>
      <h2>HeroUI Token</h2>
      <div class="tbl-wrap"><table id="tokens"><thead><tr><th>变量</th><th>Light</th><th>Dark</th></tr></thead><tbody></tbody></table></div>
    </section>

    <section>
      <h2>图表色</h2>
      <div class="charts" id="charts"></div>
      <div class="ramps" id="ramps"></div>
    </section>
  </main>

  <section>
    <h2>导出</h2>
    <div class="code">
      <div class="code-head"><div class="seg" id="files" role="group" aria-label="文件"></div><button class="copy" id="copy" type="button">复制</button></div>
      <pre id="out"></pre>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

lue\": \"{color.throat.900}\"\n    },\n    \"segment-foreground\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.paper}\"\n    },\n    \"border\": {\n      \"$type\": \"color\",\n      \"$value\": {\n        \"colorSpace\": \"oklch\",\n        \"components\": [\n          0.3191,\n          0.0354,\n          268.71\n        ],\n        \"hex\": \"#2b3245\"\n      },\n      \"$description\": \"color-mix(in oklab, throat-950 55%, throat-800 45%)\"\n    },\n    \"separator\": {\n      \"$type\": \"color\",\n      \"$value\": {\n        \"colorSpace\": \"oklch\",\n        \"components\": [\n          0.2825,\n          0.037,\n          266.5\n        ],\n        \"hex\": \"#21293c\"\n      },\n      \"$description\": \"color-mix(in oklab, throat-950 65%, throat-900 35%)\"\n    },\n    \"focus\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.niltava.400}\"\n    },\n    \"link\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.niltava.300}\"\n    },\n    \"accent-soft-foreground\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.niltava.300}\"\n    },\n    \"success-soft-foreground\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.leaf.300}\"\n    },\n    \"warning-soft-foreground\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.gold.300}\"\n    },\n    \"danger-soft-foreground\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.berry.300}\"\n    },\n    \"info-soft-foreground\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.glossy.300}\"\n    },\n    \"rufous-soft-foreground\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.rufous.300}\"\n    }\n  },\n  \"chart\": {\n    \"1\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.niltava.400}\"\n    },\n    \"2\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.rufous.300}\"\n    },\n    \"3\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.leaf.200}\"\n    },\n    \"4\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.violet.500}\"\n    },\n    \"5\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.gold.500}\"\n    },\n    \"6\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.berry.400}\"\n    },\n    \"7\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.glossy.300}\"\n    },\n    \"8\": {\n      \"$type\": \"color\",\n      \"$value\": \"{color.throat.400}\"\n    }\n  }\n}\n"}};
const STEPS=D.steps, BASE=600;
const NAMES={niltava:'Niltava 钴蓝',rufous:'Rufous 棕腹',glossy:'Glossy 亮斑',violet:'Violet 紫辉',throat:'Throat 喉墨',leaf:'Leaf 新叶',berry:'Berry 浆果',gold:'Gold 金腹'};
const hexOf=r=>r==='white'?'#FFFFFF':(D.scales[r.split('-')[0]]||{})[r.split('-')[1]];

function lum(h){const v=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function cr(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const INK=D.scales.throat['950'];
const fgOn=h=>cr(h,'#FFFFFF')>=cr(h,INK)?'#FFFFFF':INK;

const toastEl=document.getElementById('toast');let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),1400)}
async function copy(text,label){try{await navigator.clipboard.writeText(text);toast('已复制 '+label)}catch(e){toast('复制失败，请手动选中')}}

function seg(el,opts,cur,on){
  el.innerHTML=Object.entries(opts).map(([k,v])=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${v}</button>`).join('');
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));on(b.dataset.k)});
}

// 色觉模拟（Machado 2009，线性 RGB）
const CVD={protan:[[0.152286,1.052583,-0.204868],[0.114503,0.786281,0.099216],[-0.003882,-0.048116,1.051998]],
  deutan:[[0.367322,0.860646,-0.227968],[0.280085,0.672501,0.047413],[-0.01182,0.04294,0.968881]],
  tritan:[[1.255528,-0.076749,-0.178779],[-0.078411,0.930809,0.147602],[0.004733,0.691367,0.3039]]};
document.getElementById('cvd-defs').innerHTML=Object.entries(CVD).map(([k,m])=>`<filter id="cvd-${k}" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="${m.map(r=>r.join(' ')+' 0 0').join(' ')} 0 0 0 1 0"/></filter>`).join('');
const sim=document.getElementById('sim'), spec=document.getElementById('specimen');
seg(document.getElementById('vision'),{normal:'正常',protan:'红色盲',deutan:'绿色盲',tritan:'蓝色盲'},'normal',k=>{const f=k==='normal'?'':`url(#cvd-${k})`;sim.style.filter=f;spec.style.filter=f});

const SPEC=[[6,'glossy-400'],[22,'niltava-600'],[10,'niltava-900'],[9,'throat-950'],[18,'rufous-500'],[7,'leaf-600'],[3,'berry-600'],[25,'throat-100']];
spec.innerHTML=SPEC.map(([f,r])=>`<div style="flex:${f};background:${hexOf(r)}"></div>`).join('');

document.getElementById('scales').innerHTML=Object.entries(D.scales).map(([k,s])=>`<div class="scale"><div class="scale-meta"><h3>${NAMES[k]}</h3><span>${k}</span></div><div class="steps">${STEPS.map(st=>{const h=s[st];return `<button type="button" class="step${st===BASE?' key':''}" data-hex="${h}" title="${D.oklch[k][st]}" aria-label="${k}-${st} ${h}"><span class="sw" style="background:${h};color:${fgOn(h)}">${st}</span><span class="lbl">${h}</span></button>`}).join('')}</div></div>`).join('');
document.getElementById('scales').addEventListener('click',e=>{const b=e.target.closest('.step');if(b)copy(b.dataset.hex,b.dataset.hex)});

const GROUPS=[['基础',['background','foreground','surface','surface-secondary','surface-tertiary','overlay','muted','border','separator','focus','link']],
  ['组件',['default','default-foreground','accent','accent-foreground','accent-soft-foreground','segment','segment-foreground']],
  ['表单',['field-background','field-foreground','field-placeholder']],
  ['状态',['success','success-foreground','success-soft-foreground','warning','warning-foreground','warning-soft-foreground','danger','danger-foreground','danger-soft-foreground']],
  ['扩展',['info','info-foreground','info-soft-foreground','rufous','rufous-foreground','rufous-soft-foreground']]];
const cell=(h,r)=>`<div class="cell"><span class="dot" style="background:${h}"></span><div><code>${h}</code><small>${r}</small></div></div>`;
document.querySelector('#tokens tbody').innerHTML=GROUPS.map(([g,keys])=>`<tr class="group"><td colspan="3">${g}</td></tr>`+keys.map(k=>`<tr><td><code>--${k}</code></td><td>${cell(D.resolved.light[k],D.semantic.light[k])}</td><td>${cell(D.resolved.dark[k],D.semantic.dark[k])}</td></tr>`).join('')).join('');

const H=[.62,.48,.38,.32,.26,.2,.16,.12];
document.getElementById('charts').innerHTML=['light','dark'].map(m=>{const bg=D.resolved[m].surface,fg=D.resolved[m].foreground,mu=D.resolved[m].muted;const c=D.chart[m].map(hexOf);
  return `<div class="chart-card" style="background:${bg};color:${fg}"><span class="t" style="color:${mu}">${m}</span>
  <div class="series">${c.map((h,i)=>`<div style="background:${h};color:${fgOn(h)}">${i+1}</div>`).join('')}</div>
  <div class="bars">${[0,1,2].map(g=>c.map((h,i)=>`<i style="background:${h};height:${Math.round((H[i]+g*.08)*100)}%"></i>`).join('')).join('<span style="width:10px"></span>')}</div>
  <div class="mono" style="font-size:.7rem;color:${mu}">${D.chart[m].join(' · ')}</div></div>`}).join('');
const seq=[100,200,300,400,500,600,700,800,900].map(s=>'niltava-'+s);
const div=['rufous-700','rufous-500','rufous-300','rufous-100','throat-100','niltava-100','niltava-300','niltava-500','niltava-700'];
document.getElementById('ramps').innerHTML=[['顺序 · niltava',seq],['发散 · rufous ↔ niltava',div]].map(([t,r])=>`<div><span>${t}</span><div class="ramp">${r.map(x=>`<i style="background:${hexOf(x)}" title="${x}"></i>`).join('')}</div></div>`).join('');

const out=document.getElementById('out');let cur=Object.keys(D.files)[0];
const showFile=k=>{cur=k;out.textContent=D.files[k]};
seg(document.getElementById('files'),Object.fromEntries(Object.keys(D.files).map(k=>[k,k])),cur,showFile);showFile(cur);
document.getElementById('copy').onclick=()=>copy(D.files[cur],cur);
</script>
